###############################################################################
# FakeNet-NG configuration used for the FalconBridge analysis (isolated phase).
# Simulates the whole network locally so that the sample reveals its connection attempts
# (DNS names, destination IP/port, first packet) without any real Internet access.
#
# Run:  fakenet.exe -c fakenet_FalconBridge.ini
# Attempted connections show up in the FakeNet console AND in the pcap FakeNet writes.
# Cross-check with frida.log and the Wireshark/dumpcap capture.
#
# NOTE: in the end the sample's HTTPS beacon was only observed as WinHTTP API calls made from
# explorer.exe (see the report). This file is kept as a starting point; adapt it to your lab.
###############################################################################

[FakeNet]
DivertTraffic:      Yes
Logging:            INFO
# Dump a pcap of all diverted traffic:
DumpPackets:        Yes
DumpPacketsFilePrefix: fakenet_FalconBridge

[Diverter]
# SingleHost = the VM has no second machine; all outbound traffic is captured.
NetworkMode:        SingleHost
# Redirect ALL traffic (including to arbitrary IPs) to the listeners:
RedirectAllTraffic: Yes
DefaultTCPListener:  RawTCPListener
DefaultUDPListener:  RawUDPListener
# Port blacklists (empty = none). Keep the VM network host-only regardless:
BlackListPortsTCP:
BlackListPortsUDP:
# Log each process -> connection (which PID attempts what):
ProcessWhiteList:
ProcessBlackList:

###############################################################################
# Listeners
###############################################################################

[DNS Server]
Enabled:     True
Port:        53
Protocol:    UDP
Listener:    DNSListener
# Answers every resolution with a local address (192.0.2.123, TEST-NET-1)
# and LOGS the requested name -> reveals the domains the sample tries to reach.
DNSResponse: 192.0.2.123
NXDOMAINS:   0

[RawTCPListener]
Enabled:     True
Port:        1337
Protocol:    TCP
Listener:    RawListener
UseSSL:      No
# Catch-all: logs and echoes the received bytes (reveals the first packet).

[RawUDPListener]
Enabled:     True
Port:        1337
Protocol:    UDP
Listener:    RawListener

[HTTPListener]
Enabled:     True
Port:        80
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      No
Webroot:     defaultFiles

[HTTPSListener]
Enabled:     True
Port:        443
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      Yes

# --- Optional: common STUN ports (UDP 3478 / 19302), kept from an early P2P hypothesis ---
[STUN-3478]
Enabled:     True
Port:        3478
Protocol:    UDP
Listener:    RawListener

[STUN-19302]
Enabled:     True
Port:        19302
Protocol:    UDP
Listener:    RawListener
